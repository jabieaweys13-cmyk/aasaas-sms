name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Need src.tgz
        run: test -f src.tgz || (echo "src.tgz weli lama soo gelin" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          mkdir -p work && tar xzf src.tgz -C work
          cd work/AasaasSMS
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/AasaasSMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AasaasSMS-apk
          path: AasaasSMS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Aasaas SMS ${{ github.run_number }}
          files: AasaasSMS.apk
