name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          python3 - <<'PY'
          import os, re
          t = open('bundle.txt', encoding='utf-8').read().replace('\r\n', '\n')
          parts = re.split(r'^@@@FILE (.+)$', t, flags=re.M)
          for i in range(1, len(parts), 2):
              p = 'work/' + parts[i].strip()
              c = parts[i + 1]
              if c.startswith('\n'):
                  c = c[1:]
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'w', encoding='utf-8').write(c)
              print('wrote', p)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          cd work/AasaasSMS
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/AasaasSMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AasaasSMS-apk
          path: AasaasSMS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Aasaas SMS ${{ github.run_number }}
          files: AasaasSMS.apk
